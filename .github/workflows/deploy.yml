name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: true

env:
  PROJECT_ID: gdgoc2026
  REGION: asia-northeast1
  GOOGLE_CLOUD_PROJECT: gdgoc2026
  GOOGLE_CLOUD_LOCATION: asia-northeast1
  SERVICE: plum-ramen-api
  REPOSITORY: plum-ramen
  IMAGE_NAME: plum-ramen-api
  IMAGE_URI: asia-northeast1-docker.pkg.dev/gdgoc2026/plum-ramen/plum-ramen-api:${{ github.sha }}
  INSTANCE_CONNECTION_NAME: gdgoc2026:asia-northeast1:plum-ramen-db
  DB_NAME: appdb
  DB_USER: appuser
  SECRET_NAME: db-pass
  RUNTIME_SERVICE_ACCOUNT: plum-ramen-run@gdgoc2026.iam.gserviceaccount.com
  FIREBASE_AUTH_DOMAIN: gdgoc2026.firebaseapp.com
  FIREBASE_PROJECT_ID: gdgoc2026
  FIREBASE_MESSAGING_SENDER_ID: "150862397359"
  FIREBASE_STORAGE_BUCKET: gdgoc2026.firebasestorage.app
  FIREBASE_WEB_SDK_VERSION: 11.6.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_NAME }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT_NAME }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build container image
        run: docker build -t "${IMAGE_URI}" .

      - name: Push container image
        run: docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="${IMAGE_URI}" \
            --region="${REGION}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --allow-unauthenticated \
            --execution-environment=gen2 \
            --add-cloudsql-instances="${INSTANCE_CONNECTION_NAME}" \
            --set-env-vars="INSTANCE_CONNECTION_NAME=${INSTANCE_CONNECTION_NAME},DB_USER=${DB_USER},DB_NAME=${DB_NAME},GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT},GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION},FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN},FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID},FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID},FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET},FIREBASE_WEB_SDK_VERSION=${FIREBASE_WEB_SDK_VERSION},FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }},FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }},FIREBASE_MEASUREMENT_ID=${{ vars.FIREBASE_MEASUREMENT_ID }},AUTH_ALLOWED_EMAIL_DOMAIN=${{ vars.AUTH_ALLOWED_EMAIL_DOMAIN }}" \
            --set-secrets="DB_PASS=${SECRET_NAME}:latest" \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=20 \
            --min-instances=0 \
            --max-instances=3
