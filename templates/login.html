<body style="background-color: #FAF6EE; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box;">
    <div style="position: fixed; top: 8px; left: 8px;">
        <button onclick="localStorage.setItem('dev_mode','true'); window.location.href='/diary-form'">dev</button>
    </div>
    <main style="text-align: center;">
        <h1 style="color: #D4607A; font-size: 2rem; letter-spacing: 2px; margin-bottom: 32px;">uMeBTI</h1>
        <button id="login-button" style="padding: 14px 40px; border-radius: 30px; border: none; background: #D4607A; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; box-shadow: 0 4px 15px rgba(212, 96, 122, 0.3); transition: 0.2s;" onmouseover="this.style.background='#B84D65'" onmouseout="this.style.background='#D4607A'">ログイン</button>
        <p id="error-message" style="color: #D4607A; margin-top: 16px; font-size: 0.9rem;"></p>
    </main>

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { auth, login, logout } from "/static/firebase-auth.js";

        const loginBtn = document.getElementById("login-button");
        const errorMessage = document.getElementById("error-message");

        loginBtn.addEventListener("click", async () => {
            if (auth.currentUser) {
                await logout();
            } else {
                try {
                    await login();
                } catch (error) {
                    errorMessage.textContent = error.message;
                }
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "/diary-form";
            } else {
                loginBtn.textContent = "ログイン";
            }
        })
    </script>
</body>
