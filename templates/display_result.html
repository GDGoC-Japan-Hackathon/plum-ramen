<body
    style="background-color: #FAF6EE; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; margin: 0; padding: 40px 20px;">

    {% include "components/header.html" %}

    <main class="result-page" style="max-width: 800px; margin: 0 auto;">
        <div class="result-card"
            style="background: white; border-radius: 32px; padding: 48px 32px; box-shadow: 0 15px 35px rgba(212, 96, 122, 0.05); border: 1px solid #FAE8ED; text-align: center;">

            <div
                style="color: #D4607A; font-size: 0.75rem; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px;">
                Your Personality Type
            </div>

            <h1 id="type-text"
                style="font-size: 5rem; color: #1a1a1a; margin: 0; line-height: 1; letter-spacing: -2px;">
                ----
            </h1>

            <div id="type-nickname"
                style="font-size: 1.75rem; color: #D4607A; font-weight: bold; margin-top: 10px; margin-bottom: 40px;">
                分析中...
            </div>

            <div
                style="position: relative; background: #FAF6EE; border-radius: 20px; padding: 32px; border: 1px solid #FAE8ED; margin-bottom: 60px;">
                <div
                    style="position: absolute; top: 10px; right: 20px; font-size: 4rem; color: #D4607A; opacity: 0.05; font-family: serif; line-height: 1;">
                    ”</div>

                <div id="summary-area"
                    style="font-size: 1rem; color: #1A1A1A; line-height: 1.8; text-align: left; position: relative; z-index: 1;">
                    診断結果を読み込んでいます...
                </div>
            </div>

            <div id="future-hint-card"
                style="display: none; position: relative; background: linear-gradient(135deg, #FFF7E0 0%, #FAF6EE 100%); border-radius: 20px; padding: 32px; border: 1px solid #E8B84B; margin-bottom: 60px; text-align: left;">
                <div
                    style="color: #A36A00; font-size: 0.75rem; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px;">
                    Next Hint
                </div>
                <div id="future-hint-area"
                    style="font-size: 1rem; color: #1A1A1A; line-height: 1.8;">
                </div>
            </div>

            <div style="margin-top: 40px;">
                <div
                    style="color: #94a3b8; font-size: 0.75rem; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px;">
                    Personality Balance
                </div>

                <div id="score-area"
                    style="max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;">
                </div>
            </div>
        </div>
    </main>

    {% include "components/footer.html" %}

    <style>
        /* スライダーの見た目 */
        .balance-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .label-left,
        .label-right {
            font-size: 0.75rem;
            color: #64748b;
            font-weight: bold;
            width: 120px;
        }

        .label-left {
            text-align: left;
        }

        .label-right {
            text-align: right;
        }

        .track {
            flex-grow: 1;
            height: 4px;
            background: #FAE8ED;
            border-radius: 2px;
            position: relative;
        }

        .dot {
            width: 14px;
            height: 14px;
            background: #D4607A;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 4px rgba(212, 96, 122, 0.3);
            transition: left 1s ease-out;
            /* ふわっと動くアニメーション */
        }
    </style>

    <script type="module">
        import { requireLogin, getIdToken } from "/static/firebase-auth.js";

        requireLogin();

        const typeTextElement = document.getElementById("type-text");
        const typeNicknameElement = document.getElementById("type-nickname");
        const scoreAreaElement = document.getElementById("score-area");
        const summaryAreaElement = document.getElementById("summary-area");
        const futureHintCardElement = document.getElementById("future-hint-card");
        const futureHintAreaElement = document.getElementById("future-hint-area");

        // スコアをスライダーの%に変換するヘルパー (-2 〜 +2 のスコア想定)
        function calculatePosition(score) {
            // 公式: (スコア - 最小値) / (最大値 - 最小値) * 100
            // (score - (-2)) / (2 - (-2)) * 100 => (score + 2) / 4 * 100
            let pos = (score + 2) * 25;

            // 念のため 0% 〜 100% の間にガードをかける
            return Math.min(Math.max(pos, 0), 100);
        }

        // タイプ名に応じた日本語の呼称を返す（オプション）
        function getNickname(type) {
            const nicknames = {
                'INFJ': '提唱者', 'INTJ': '建築家', 'INFP': '仲介者', 'INTP': '論理学者',
                'ENFJ': '主人公', 'ENTJ': '指揮官', 'ENFP': '運動家', 'ENTP': '討論者',
                'ISFJ': '擁護者', 'ISTJ': '管理者', 'ISFP': '冒険家', 'ISTP': '巨匠',
                'ESFJ': '領事官', 'ESTJ': '幹部', 'ESFP': 'エンターテイナー', 'ESTP': '起業家'
            };
            return nicknames[type] || '探求者';
        }

        async function getResult(diaryId) {
            try {
                // Bearerトークン取得(1時間の有効期限)
                const idToken = await getIdToken();

                const response = await fetch(`/api/diaries/${diaryId}/result`, {
                    headers: {
                        "Authorization": `Bearer ${idToken}`,
                    },
                });
                if (!response.ok) {
                    throw new Error(`failed to get result: ${response.status}`);
                }

                return await response.json();

            } catch (error) {
                console.error(error);
                alert("診断結果の取得に失敗しました");
                return null;
            }
        }

        function createSlider(leftLabel, rightLabel, score) {
            const pos = calculatePosition(score);
            return `
                <div class="balance-row">
                    <span class="label-left">${leftLabel}</span>
                    <div class="track">
                        <div class="dot" style="left: ${pos}%"></div>
                    </div>
                    <span class="label-right">${rightLabel}</span>
                </div>
            `;
        }

        async function run() {
            try {
                const diaryId = new URLSearchParams(window.location.search).get("diary_id");
                if (!diaryId) throw new Error("日記IDが見つかりません");

                sessionStorage.removeItem("pending-diary-id");

                const result = await getResult(diaryId);
                if (!result) throw new Error("結果データがありません");

                // 1. タイプとニックネームの表示
                typeTextElement.textContent = result.type;
                typeNicknameElement.textContent = getNickname(result.type);

                // 2. スライダーの表示 (EI, SN, TF, JP)
                scoreAreaElement.innerHTML = `
                    ${createSlider('INTROVERSION (I)', 'EXTRAVERSION (E)', result.ei_score)}
                    ${createSlider('INTUITION (N)', 'SENSING (S)', result.sn_score)}
                    ${createSlider('THINKING (T)', 'FEELING (F)', result.tf_score)}
                    ${createSlider('JUDGING (J)', 'PERCEIVING (P)', result.jp_score)}
                `;

                // 3. サマリーの表示
                summaryAreaElement.innerHTML = `<p>${result.summary}</p>`;

                // 4. 今後へのヒントの表示
                if (result.future_hint && result.future_hint.trim()) {
                    futureHintAreaElement.innerHTML = `<p>${result.future_hint}</p>`;
                    futureHintCardElement.style.display = "block";
                }

            } catch (error) {
                console.error(error);
                summaryAreaElement.textContent = "診断結果を表示できませんでした。";
            }
        }

        run();
    </script>
</body>
