<body
    style="background-color: #FAF6EE; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; margin: 0; padding: 40px 20px;">

    {% include "components/header.html" %}

    <main class="diary-page" style="max-width: 800px; margin: 0 auto;">
        <div class="diary-card"
            style="background: white; border-radius: 24px; padding: 32px; box-shadow: 0 10px 30px rgba(212, 96, 122, 0.05); border: 1px solid #FAE8ED;">

            <div
                style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px; color: #D4607A; opacity: 0.6;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
                </svg>
                <span
                    style="font-size: 0.75rem; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase;">Daily
                    Journal</span>
            </div>

            <form class="diary-form" style="display: flex; flex-direction: column;">
                <textarea class="diary-textarea" id="text" name="text"
                    placeholder="今日はどんな一日でしたか？心に浮かんだ情景を、自由に描いてみてください..."
                    style="width: 100%; min-height: 350px; border: none; outline: none; font-size: 1.1rem; line-height: 1.8; color: #1A1A1A; resize: none; background: transparent;"></textarea>

                <div class="button-row" style="display: flex; justify-content: flex-end; gap: 16px; margin-top: 24px;">
                    <button class="btn-outline" type="button" id="saveBtn"
                        style="padding: 14px 28px; border-radius: 30px; border: 1.5px solid #7BAE8A; background: white; color: #7BAE8A; font-weight: bold; cursor: pointer; font-size: 0.95rem; transition: 0.2s;">
                        保存
                    </button>
                    <button class="btn-solid" type="button" id="analyzeBtn"
                        style="padding: 14px 32px; border-radius: 30px; border: none; background: #D4607A; color: white; font-weight: bold; cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(212, 96, 122, 0.3); transition: 0.2s;">
                        質問生成
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </button>
                </div>
                <div id="loading" style="text-align: center; margin-top: 10px;"></div>
            </form>
        </div>
    </main>

    {% include "components/footer.html" %}

    <style>
        .btn-outline:hover {
            background: #EBF5EE;
            border-color: #7BAE8A;
        }

        .btn-solid:hover {
            background: #B84D65;
            transform: translateY(-2px);
        }

        .btn-solid:active {
            transform: translateY(0);
        }

        .diary-textarea::placeholder {
            color: #ccc;
            font-weight: 300;
        }
    </style>

    <script type="module">
        import { requireLogin, getIdToken } from "/static/firebase-auth.js";

        requireLogin();

        const textArea = document.getElementById("text");
        const saveBtn = document.getElementById("saveBtn");
        const analyzeBtn = document.getElementById("analyzeBtn");
        const loading = document.getElementById("loading");

        // loadingページから戻ってきた場合、セッションストレージから日記本文を取得
        const savedBody = sessionStorage.getItem("pending-diary-body");
        if (savedBody) {
            textArea.value = savedBody;
        }

        // 日記保存の関数
        async function saveDiary(diary) {

            // Bearerトークン取得(1時間の有効期限)
            const idToken = await getIdToken();

            try {
                const response = await fetch("/api/diaries", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${idToken}`,
                    },
                    body: JSON.stringify({ body: diary })
                });
                if (!response.ok) {
                    throw new Error(`failed to save diary: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error(error);
                alert("日記の保存に失敗しました");
                return null;
            }
        }

        // 日記保存のボタンクリックイベント
        saveBtn.addEventListener("click", async () => {
            const text = textArea.value;
            const savedDiary = await saveDiary(text);
            if (!savedDiary) {
                console.error("日記の保存に失敗しました");
                return;
            }
            console.log("日記を保存しました");
            console.log(savedDiary);
            alert("日記を保存しました"); // ユーザーへのフィードバック用
        });

        // 質問生成のボタンクリックイベント（ローディングページへ移動）
        analyzeBtn.addEventListener("click", async () => {
            const text = textArea.value;
            if (text.length === 0) {
                alert("日記を書いてから質問生成をしてください");
                return;
            }
            sessionStorage.setItem("pending-diary-body", text);
            sessionStorage.setItem("from-page-id", "diary-form");
            window.location.href = "/generate-loading";
        });
    </script>
</body>
