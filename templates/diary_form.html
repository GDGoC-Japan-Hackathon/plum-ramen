<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Brand New - Diary</title>
</head>

<body
    style="background-color: #fef8f8; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; margin: 0; padding: 40px 20px;">

    <header
        style="max-width: 800px; margin: 0 auto 20px; color: #d81b60; font-weight: bold; font-size: 1.2rem; letter-spacing: 1px;">
        Brand new
    </header>

    <main class="diary-page" style="max-width: 800px; margin: 0 auto;">
        <div class="diary-card"
            style="background: white; border-radius: 24px; padding: 32px; box-shadow: 0 10px 30px rgba(216, 27, 96, 0.05); border: 1px solid #fff0f3;">

            <div
                style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px; color: #d81b60; opacity: 0.6;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
                </svg>
                <span
                    style="font-size: 0.75rem; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase;">Daily
                    Journal</span>
            </div>

            <form class="diary-form" style="display: flex; flex-direction: column;">
                <textarea class="diary-textarea" id="text" name="text"
                    placeholder="今日はどんな一日でしたか？心に浮かんだ情景を、自由に描いてみてください..."
                    style="width: 100%; min-height: 350px; border: none; outline: none; font-size: 1.1rem; line-height: 1.8; color: #444; resize: none; background: transparent;"></textarea>

                <div class="button-row" style="display: flex; justify-content: flex-end; gap: 16px; margin-top: 24px;">
                    <button class="btn-outline" type="button" id="saveBtn"
                        style="padding: 14px 28px; border-radius: 30px; border: 1.5px solid #ffccd5; background: white; color: #d81b60; font-weight: bold; cursor: pointer; font-size: 0.95rem; transition: 0.2s;">
                        保存
                    </button>
                    <button class="btn-solid" type="button" id="analyzeBtn"
                        style="padding: 14px 32px; border-radius: 30px; border: none; background: #d81b60; color: white; font-weight: bold; cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(216, 27, 96, 0.3); transition: 0.2s;">
                        質問生成
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </button>
                </div>
                <div id="loading" style="text-align: center; margin-top: 10px;"></div>
            </form>
        </div>
    </main>

    <footer
        style="margin-top: 60px; text-align: center; border-top: 1px solid #eee; padding-top: 30px; padding-bottom: 40px;">
        <div style="margin-bottom: 15px; color: #666; font-size: 0.9rem;">hello world</div>
        <div style="display: flex; justify-content: center; gap: 24px;">
            <a href="/diary-form"
                style="text-decoration: none; color: #d81b60; font-size: 0.9rem; font-weight: bold;">日記作成</a>
            <a href="/answer-questions" style="text-decoration: none; color: #666; font-size: 0.9rem;">質問回答</a>
            <a href="/display-result" style="text-decoration: none; color: #666; font-size: 0.9rem;">診断結果表示</a>
        </div>
        <p style="color: #ccc; font-size: 0.75rem; margin-top: 20px;">&copy; 2026 Brand New</p>
    </footer>

    <style>
        .btn-outline:hover {
            background: #fff0f3;
            border-color: #d81b60;
        }

        .btn-solid:hover {
            background: #ad1457;
            transform: translateY(-2px);
        }

        .btn-solid:active {
            transform: translateY(0);
        }

        .diary-textarea::placeholder {
            color: #ccc;
            font-weight: 300;
        }
    </style>

    <script>
        const textArea = document.getElementById("text");
        const saveBtn = document.getElementById("saveBtn");
        const analyzeBtn = document.getElementById("analyzeBtn");
        const loading = document.getElementById("loading");

        // loadingページから戻ってきた場合、セッションストレージから日記本文を取得
        const savedBody = sessionStorage.getItem("pending-diary-body");
        if (savedBody) {
            textArea.value = savedBody;
        }

        // 日記保存の関数
        async function saveDiary(diary) {
            try {
                const response = await fetch("/api/diaries", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ body: diary })
                });
                if (!response.ok) {
                    throw new Error(`failed to save diary: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error(error);
                alert("日記の保存に失敗しました");
                return null;
            }
        }

        // 日記保存のボタンクリックイベント
        saveBtn.addEventListener("click", async () => {
            const text = textArea.value;
            const savedDiary = await saveDiary(text);
            if (!savedDiary) {
                console.error("日記の保存に失敗しました");
                return;
            }
            console.log("日記を保存しました");
            console.log(savedDiary);
            alert("日記を保存しました"); // ユーザーへのフィードバック用
        });

        // 質問生成のボタンクリックイベント（ローディングページへ移動）
        analyzeBtn.addEventListener("click", async () => {
            const text = textArea.value;
            if (text.length === 0) {
                alert("日記を書いてから質問生成をしてください");
                return;
            }
            sessionStorage.setItem("pending-diary-body", text);
            sessionStorage.setItem("from-page-id", "diary-form");
            window.location.href = "/generate-loading";
        });
    </script>
</body>

</html>
