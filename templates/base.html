<!DOCTYPE html>
<html class="light" lang="ja">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>{{ page_title | default('梅心記') }}</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="/static/css/base.css" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d11141",
                        "plum-light": "#fff5f6",
                        "plum-soft": "#fce4e8",
                        "background-light": "#fdfcfb",
                        "background-dark": "#1a1617",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "Noto Sans JP", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="overflow-hidden bg-background-light text-slate-900 font-display">
    <div class="app-shell relative flex w-full flex-col overflow-hidden">
        <div class="fixed top-20 -left-20 h-72 w-72 rounded-full bg-primary/5 blur-3xl -z-10"></div>
        <div class="fixed bottom-20 -right-20 h-80 w-80 rounded-full bg-primary/5 blur-3xl -z-10"></div>

        {% include "components/header.html" %}

        <main class="min-h-0 flex-1 overflow-hidden px-3 py-3 md:px-8 md:py-6">
            {% block content %}
            {% include "components/journal_editor.html" %}
            {% endblock %}
        </main>

        {% include "components/footer.html" %}

        {% block scripts %}
        <script type="module" src="/static/js/journal.js"></script>
        {% endblock %}
    </div>
</body>
</html>
