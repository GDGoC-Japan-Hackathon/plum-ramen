<body
    style="background-color: #FAF6EE; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;">

    {% include "components/header.html" %}
    {% include "components/toast.html" %}

    <main class="diary-page" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; overflow: hidden;">
        <div id="questions-area"
            style="width: 95%; max-width: 800px; max-height: 80vh; background: white; border-radius: 32px; padding: 48px 32px; box-shadow: 0 15px 35px rgba(212, 96, 122, 0.05); border: 1px solid #FAE8ED; text-align: center; box-sizing: border-box;">

            <div
                style="width: 100%; height: 8px; background: #FAF6EE; border-radius: 4px; margin-bottom: 32px; overflow: hidden;">
                <div id="progress-bar"
                    style="width: 0%; height: 100%; background: #D4607A; transition: width 0.3s ease;"></div>
            </div>

            <div id="question-number"
                style="display: inline-block; background: #E8B84B; color: #1A1A1A; padding: 4px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; letter-spacing: 1px; margin-bottom: 24px; text-transform: uppercase;">
                QUESTION
            </div>

            <h2 id="question-text"
                style="font-size: 1.75rem; color: #1A1A1A; margin-bottom: 40px; line-height: 1.4; font-weight: bold;">
                読み込み中...
            </h2>

            <div id="choices-area"
                style="display: flex; flex-direction: column; gap: 16px; max-width: 600px; margin: 0 auto;">
            </div>
        </div>
    </main>

    {% include "components/footer.html" %}

    <style>
        /* 選択肢ボタンの共通スタイル */
        .choice-btn {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            padding: 16px 24px;
            background: #FAF6EE;
            border: 1px solid #FAE8ED;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .choice-btn:hover {
            background: #FAE8ED;
            border-color: #D4607A;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 96, 122, 0.08);
        }

        /* A, B, C の丸ラベル */
        .choice-label {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
            background: #D4607A;
            color: white;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 2px 6px rgba(212, 96, 122, 0.3);
        }

        .choice-content {
            font-size: 1rem;
            color: #1A1A1A;
            font-weight: 500;
            line-height: 1.4;
        }
    </style>

    <script type="module">
        import { requireLogin, getIdToken } from "/static/firebase-auth.js";

        requireLogin();

        const questionsAreaElement = document.getElementById("questions-area");
        const questionTextElement = document.getElementById("question-text");
        const choicesAreaElement = document.getElementById("choices-area");
        const questionNumberElement = document.getElementById("question-number");

        const diaryId = new URLSearchParams(window.location.search).get("diary_id");
        if (!diaryId) {
            // エラー表示も少し綺麗に
            questionsAreaElement.innerHTML = "<p style='color:#D4607A;'>日記IDが見つかりません。最初からやり直してください。</p>";
            throw new Error("日記IDが見つかりません");
        }

        let questions = [];
        let currentIndex = 0;
        let answers = {};
        let isChoiceLocked = false;
        let isSubmitting = false;

        // 1. 要素の取得を追加
        const progressBarElement = document.getElementById("progress-bar");

        function setChoiceButtonsDisabled(disabled) {
            choicesAreaElement.querySelectorAll(".choice-btn").forEach((button) => {
                button.disabled = disabled;
                button.style.opacity = disabled ? "0.65" : "1";
                button.style.cursor = disabled ? "not-allowed" : "pointer";
            });
        }

        // 2. renderQuestion関数を以下のように変更
        function renderQuestion() {
            const question = questions[currentIndex];
            const totalQuestions = questions.length;
            isChoiceLocked = false;

            // 進捗率の計算とバーの更新
            const progressPercent = ((currentIndex + 1) / totalQuestions) * 100;
            progressBarElement.style.width = `${progressPercent}%`;

            // 質問番号の表示を「現在の数 / 全体の数」に変更
            const qNum = currentIndex + 1;
            questionNumberElement.textContent = `QUESTION ${qNum} / ${totalQuestions}`;

            // 質問文の更新
            questionTextElement.textContent = question.question_text;

            // 選択肢ボタンの生成 (以下、既存コードと同じ)
            choicesAreaElement.innerHTML = `
                <button class="choice-btn" id="choiceA">
                    <span class="choice-label">A</span>
                    <span class="choice-content">${question.choice_a}</span>
                </button>
                <button class="choice-btn" id="choiceB">
                    <span class="choice-label">B</span>
                    <span class="choice-content">${question.choice_b}</span>
                </button>
                <button class="choice-btn" id="choiceC">
                    <span class="choice-label">C</span>
                    <span class="choice-content">${question.choice_c}</span>
                </button>
            `;

            document.getElementById("choiceA").addEventListener("click", () => handleAnswerSelect("A"));
            document.getElementById("choiceB").addEventListener("click", () => handleAnswerSelect("B"));
            document.getElementById("choiceC").addEventListener("click", () => handleAnswerSelect("C"));
        }

        function handleAnswerSelect(choiceKey) {
            if (isChoiceLocked || isSubmitting) return;

            isChoiceLocked = true;
            setChoiceButtonsDisabled(true);

            const question = questions[currentIndex];
            answers[question.question_id] = choiceKey;
            sessionStorage.setItem("draft-answers", JSON.stringify(answers));

            if (currentIndex >= questions.length - 1) {
                submitAnswers();
                return;
            }
            nextQuestion();
        }

        function nextQuestion() {
            currentIndex += 1;
            renderQuestion();
        }

        async function submitAnswers() {
            if (isSubmitting) return;

            const draftAnswers = JSON.parse(sessionStorage.getItem("draft-answers") || "{}");
            const payload = {
                answers: Object.entries(draftAnswers).map(([questionId, choiceKey]) => ({
                    question_id: Number(questionId),
                    selected_choice: choiceKey,
                })),
            };

            try {
                isSubmitting = true;
                // Bearerトークン取得(1時間の有効期限)
                const idToken = await getIdToken();
                setChoiceButtonsDisabled(true);

                const response = await fetch(`/api/diaries/${diaryId}/questions/answers`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${idToken}`,
                    },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) throw new Error(`failed to submit: ${response.status}`);

                sessionStorage.removeItem("draft-answers");
                sessionStorage.setItem("from-page-id", "answer-questions");
                window.location.href = "/generate-loading";
            } catch (error) {
                console.error(error);
                isSubmitting = false;
                isChoiceLocked = false;
                setChoiceButtonsDisabled(false);
                showToast("回答の保存に失敗しました");
            }
        }

        async function loadQuestions() {
            try {
                // Bearerトークン取得(1時間の有効期限)
                const idToken = await getIdToken();

                const response = await fetch(`/api/diaries/${diaryId}/questions`, {
                    headers: {
                        "Authorization": `Bearer ${idToken}`,
                    },
                });
                if (!response.ok) {
                    throw new Error(`failed to load questions: ${response.status}`);
                }
                questions = await response.json();

                renderQuestion();
            } catch (error) {
                console.error(error);
                questionTextElement.textContent = "質問の読み込みに失敗しました";
            }
        }

        loadQuestions();
    </script>
</body>
