<body
    style="background-color: #fef8f8; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; margin: 0; padding: 40px 20px;">

    {% include "components/header.html" %}

    <main class="diary-page" style="max-width: 800px; margin: 0 auto;">
        <div id="questions-area"
            style="background: white; border-radius: 32px; padding: 48px 32px; box-shadow: 0 15px 35px rgba(216, 27, 96, 0.05); border: 1px solid #fff0f3; text-align: center;">

            <div id="question-number"
                style="display: inline-block; background: #fff0f3; color: #d81b60; padding: 4px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; letter-spacing: 1px; margin-bottom: 24px; text-transform: uppercase;">
                QUESTION
            </div>

            <h2 id="question-text"
                style="font-size: 1.75rem; color: #2d3436; margin-bottom: 40px; line-height: 1.4; font-weight: bold;">
                読み込み中...
            </h2>

            <div id="choices-area"
                style="display: flex; flex-direction: column; gap: 16px; max-width: 600px; margin: 0 auto;">
            </div>
        </div>
    </main>

    {% include "components/footer.html" %}

    <style>
        /* 選択肢ボタンの共通スタイル */
        .choice-btn {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            padding: 16px 24px;
            background: #fffafb;
            border: 1px solid #ffeef1;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .choice-btn:hover {
            background: #fff0f3;
            border-color: #d81b60;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(216, 27, 96, 0.08);
        }

        /* A, B, C の丸ラベル */
        .choice-label {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
            background: #ad1457;
            color: white;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 2px 6px rgba(173, 20, 87, 0.3);
        }

        .choice-content {
            font-size: 1rem;
            color: #444;
            font-weight: 500;
            line-height: 1.4;
        }
    </style>

    <script type="module">
        import { requireLogin, getIdToken } from "/static/firebase-auth.js";

        requireLogin();

        const questionsAreaElement = document.getElementById("questions-area");
        const questionTextElement = document.getElementById("question-text");
        const choicesAreaElement = document.getElementById("choices-area");
        const questionNumberElement = document.getElementById("question-number");

        const diaryId = new URLSearchParams(window.location.search).get("diary_id");
        if (!diaryId) {
            // エラー表示も少し綺麗に
            questionsAreaElement.innerHTML = "<p style='color:#d81b60;'>日記IDが見つかりません。最初からやり直してください。</p>";
            throw new Error("日記IDが見つかりません");
        }

        let questions = [];
        let currentIndex = 0;
        let answers = {};

        function renderQuestion() {
            const question = questions[currentIndex];

            // 質問番号の更新 (例: QUESTION 01)
            const qNum = (currentIndex + 1).toString().padStart(2, '0');
            questionNumberElement.textContent = `QUESTION ${qNum}`;

            // 質問文の更新
            questionTextElement.textContent = question.question_text;

            // 選択肢ボタンの生成 (HTML構造を画像に合わせる)
            choicesAreaElement.innerHTML = `
                <button class="choice-btn" id="choiceA">
                    <span class="choice-label">A</span>
                    <span class="choice-content">${question.choice_a}</span>
                </button>
                <button class="choice-btn" id="choiceB">
                    <span class="choice-label">B</span>
                    <span class="choice-content">${question.choice_b}</span>
                </button>
                <button class="choice-btn" id="choiceC">
                    <span class="choice-label">C</span>
                    <span class="choice-content">${question.choice_c}</span>
                </button>
            `;

            document.getElementById("choiceA").addEventListener("click", () => handleAnswerSelect("A"));
            document.getElementById("choiceB").addEventListener("click", () => handleAnswerSelect("B"));
            document.getElementById("choiceC").addEventListener("click", () => handleAnswerSelect("C"));
        }

        function handleAnswerSelect(choiceKey) {
            const question = questions[currentIndex];
            answers[question.question_id] = choiceKey;
            sessionStorage.setItem("draft-answers", JSON.stringify(answers));

            if (currentIndex >= questions.length - 1) {
                submitAnswers();
                return;
            }
            nextQuestion();
        }

        function nextQuestion() {
            currentIndex += 1;
            renderQuestion();
        }

        async function submitAnswers() {
            const draftAnswers = JSON.parse(sessionStorage.getItem("draft-answers") || "{}");
            const payload = {
                answers: Object.entries(draftAnswers).map(([questionId, choiceKey]) => ({
                    question_id: Number(questionId),
                    selected_choice: choiceKey,
                })),
            };

            try {
                // Bearerトークン取得(1時間の有効期限)
                const idToken = await getIdToken();

               // 送信中の表示
               questionsAreaElement.innerHTML = "<p style='color:#d81b60; font-weight:bold;'>回答を送信しています...</p>";

                const response = await fetch(`/api/diaries/${diaryId}/questions/answers`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${idToken}`,
                    },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) throw new Error(`failed to submit: ${response.status}`);

                sessionStorage.removeItem("draft-answers");
                sessionStorage.setItem("from-page-id", "answer-questions");
                window.location.href = "/generate-loading";
            } catch (error) {
                console.error(error);
                alert("回答の保存に失敗しました");
            }
        }

        async function loadQuestions() {
            try {
                // Bearerトークン取得(1時間の有効期限)
                const idToken = await getIdToken();

                const response = await fetch(`/api/diaries/${diaryId}/questions`, {
                    headers: {
                        "Authorization": `Bearer ${idToken}`,
                    },
                });
                if (!response.ok) {
                    throw new Error(`failed to load questions: ${response.status}`);
                }
                questions = await response.json();

                renderQuestion();
            } catch (error) {
                console.error(error);
                questionTextElement.textContent = "質問の読み込みに失敗しました";
            }
        }

        loadQuestions();
    </script>
</body>

</html>
