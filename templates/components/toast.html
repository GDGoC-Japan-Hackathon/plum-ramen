<div id="toast-container" style="
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
"></div>

<style>
    .toast {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-radius: 16px;
        font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
        font-size: 0.9rem;
        font-weight: 500;
        line-height: 1.4;
        box-shadow: 0 8px 24px rgba(212, 96, 122, 0.12);
        pointer-events: auto;
        min-width: 240px;
        max-width: 340px;
        opacity: 0;
        transform: translateX(40px);
        transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .toast.show {
        opacity: 1;
        transform: translateX(0);
    }

    .toast.hide {
        opacity: 0;
        transform: translateX(40px);
    }

    .toast-error {
        background: white;
        border: 1px solid #FAE8ED;
        color: #1A1A1A;
        border-left: 4px solid #D4607A;
    }

    .toast-success {
        background: white;
        border: 1px solid #d4edda;
        color: #1A1A1A;
        border-left: 4px solid #7BAE8A;
    }

    .toast-warning {
        background: white;
        border: 1px solid #fdecc8;
        color: #1A1A1A;
        border-left: 4px solid #E8B84B;
    }

    .toast-icon {
        font-size: 1.1rem;
        flex-shrink: 0;
    }

    .toast-close {
        margin-left: auto;
        background: none;
        border: none;
        cursor: pointer;
        color: #94a3b8;
        font-size: 1rem;
        padding: 0;
        line-height: 1;
        flex-shrink: 0;
        transition: color 0.2s;
    }

    .toast-close:hover {
        color: #D4607A;
    }
</style>

<script>
    function showToast(message, type = "error", duration = 3500) {
        const container = document.getElementById("toast-container");

        const icons = {
            error: "✕",
            success: "✓",
            warning: "!",
        };

        const toast = document.createElement("div");
        toast.className = `toast toast-${type}`;
        toast.innerHTML = `
            <span class="toast-icon">${icons[type] ?? "!"}</span>
            <span style="flex:1">${message}</span>
            <button class="toast-close" onclick="this.closest('.toast').remove()">✕</button>
        `;

        container.appendChild(toast);

        requestAnimationFrame(() => {
            requestAnimationFrame(() => toast.classList.add("show"));
        });

        setTimeout(() => {
            toast.classList.add("hide");
            toast.addEventListener("transitionend", () => toast.remove(), { once: true });
        }, duration);
    }
</script>
